{% extends "community/wizard/base_wizard.html" %}
{% load static i18n %}

{% block wizard_content %}
<div class="wizard-card">
    <div class="wizard-section-label mb-1">Step 9 of 13</div>
    <h2 class="mb-2">Optional Add-ons</h2>
    <p class="lead mb-4">Enhance your project with these premium services.</p>

    <form method="post">
        {% csrf_token %}

        <div class="row g-3">
            {% for addon in addons %}
            <div class="col-sm-6">
                <input type="checkbox" name="addons" value="{{ addon.slug }}" id="addon_{{ addon.slug }}" class="wizard-check-input" {% if addon.slug in selected_addons %}checked{% endif %}>
                <label for="addon_{{ addon.slug }}" class="wizard-check-label h-100">
                    <span class="check-icon"><i class="fas fa-check" style="font-size:0.7rem;"></i></span>
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between align-items-start">
                            <strong class="small">{{ addon.name }}</strong>
                            <span class="badge bg-light text-dark small fw-700">${{ addon.price|floatformat:0 }}</span>
                        </div>
                        <p class="text-secondary small mb-0 mt-1">{{ addon.description|truncatechars:80 }}</p>
                    </div>
                </label>
            </div>
            {% endfor %}
        </div>

        <div class="mt-5 text-center">
            <button type="submit" class="btn-wizard-next px-5 py-3">
                Continue <i class="fas fa-arrow-right ms-2"></i>
            </button>
        </div>
    </form>
</div>
{% endblock %}
