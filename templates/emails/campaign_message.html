{% extends "emails/base_email.html" %}
{% block title %}{{ subject }} - OnWebApp{% endblock %}
{% block content %}
<div class="campaign-body">
  {{ body_html_safe }}
</div>
{% if unsubscribe_url %}
<p style="margin-top:28px;padding-top:16px;border-top:1px solid #e4e6f0;font-size:12px;color:#8a8fa8;line-height:1.5;">
  You are receiving this email because you have an OnWebApp account.<br>
  <a href="{{ unsubscribe_url }}" style="color:#4F46E5;">Unsubscribe from marketing emails</a>
</p>
{% endif %}
{% endblock %}
