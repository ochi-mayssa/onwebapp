<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OnWebApp{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5fa;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5fa;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:560px;background-color:#ffffff;border-radius:8px;border:1px solid #e4e6f0;" cellpadding="0" cellspacing="0">
          <tr>
            <td style="background-color:#4F46E5;padding:20px 28px;">
              <span style="font-size:18px;font-weight:bold;color:#ffffff;">OnWebApp</span>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;color:#1f2333;font-size:15px;line-height:1.6;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px;border-top:1px solid #e4e6f0;color:#8a8fa8;font-size:12px;line-height:1.5;">
              You received this message because your details were submitted on onwebapp.com.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
