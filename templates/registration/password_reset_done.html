{% extends 'base.html' %}
{% block title %}Password Reset Sent{% endblock %}
{% block content %}
<div class="container mt-5 mb-5">
    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-5">
                    <h3 class="mb-4">Check Your Email</h3>
                    <p>If an account exists with the email you entered, a password reset link has been sent. Please check your inbox.</p>
                    <a href="{% url 'users:login_view' %}" class="btn btn-primary w-100 mt-3">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
