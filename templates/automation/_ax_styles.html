{% load static %}
<style>
    html{scroll-behavior:smooth}
    :root{--ax-violet:#7c3aed;--ax-violet-2:#a78bfa;--ax-indigo:#4F46E5;--ax-blue:#2563eb;--ax-gold:#D9A441;--ax-ink:#0F172A;--ax-body:#5B6478;--ax-soft:#F4F6FB}
    .ax-hero{color:#fff;padding:7rem 0 5rem;min-height:60vh;display:flex;align-items:center;position:relative;overflow:hidden;background:#000308 url('{% static "img/automationhome.png" %}') right center/contain no-repeat}
    .ax-hero__shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,3,8,.94) 0%,rgba(0,3,8,.8) 28%,rgba(0,3,8,.45) 55%,rgba(0,3,8,.12) 80%,rgba(0,3,8,0) 100%);pointer-events:none}
    .ax-hero__fade{position:absolute;bottom:0;left:0;right:0;height:100px;background:linear-gradient(to top,#fff,transparent);pointer-events:none;z-index:2}
    .ax-hero__inner{position:relative;z-index:1;max-width:600px;margin:0 auto 0 clamp(0px,8vw,120px);text-align:left}
    .ax-hero__eyebrow{display:inline-block;font-family:'Fraunces',Georgia,serif;font-style:italic;color:var(--ax-violet-2);font-size:1.05rem;font-weight:500;margin-bottom:16px;letter-spacing:.03em}
    .ax-hero__title{font-family:'Fraunces',Georgia,serif;font-size:clamp(2.4rem,5vw,3.5rem);font-weight:600;color:#fff;line-height:1.1;letter-spacing:-.02em;margin-bottom:1.25rem}
    .ax-hero__sub{color:rgba(255,255,255,.72);font-size:1.1rem;max-width:480px;margin:0 0 2rem;line-height:1.75}
    .ax-hero__actions{display:flex;flex-wrap:wrap;gap:1rem}
    .ax-hero__actions--center{justify-content:center}
    .ax-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.85rem 2rem;border-radius:50px;font-weight:700;font-size:.88rem;text-decoration:none;transition:transform .25s,box-shadow .25s,background .25s;cursor:pointer;border:0}
    .ax-btn:hover{transform:translateY(-2px)}
    .ax-btn i{font-size:.78rem}
    .ax-btn--primary{background:linear-gradient(135deg,var(--ax-violet),var(--ax-violet-2));color:#fff;box-shadow:0 6px 28px rgba(124,58,237,.35)}
    .ax-btn--ghost{background:transparent;border:1.5px solid rgba(255,255,255,.3);color:#fff}
    .ax-btn--ghost:hover{background:rgba(255,255,255,.08)}
    .ax-btn--dark-ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff}
    .ax-btn--dark-ghost:hover{background:rgba(255,255,255,.12)}
    .ax-btn--outline{background:transparent;border:1.5px solid rgba(124,58,237,.4);color:var(--ax-violet)}
    .ax-btn--outline:hover{background:rgba(124,58,237,.06)}
    .ax-sec{background:#fff;padding:5rem 0}
    .ax-sec--soft{background:var(--ax-soft)}
    .ax-sec--tint{background:linear-gradient(180deg,#F8F7FF 0%,#EFF2FF 100%)}
    .ax-feat{display:grid;grid-template-columns:1.15fr 1fr;gap:3.5rem;align-items:center}
    .ax-feat--flip{grid-template-columns:1fr 1.15fr}
    .ax-feat--flip .ax-feat__media{order:-1}
    .ax-feat__lead{color:var(--ax-body);font-size:1rem;line-height:1.75;margin:0 0 1.75rem}
    .ax-feat__items{display:flex;flex-direction:column;gap:1.1rem;margin-bottom:2rem}
    .ax-feat__item{display:flex;gap:1rem;align-items:flex-start}
    .ax-feat__icon{flex:0 0 42px;width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,rgba(124,58,237,.14),rgba(124,58,237,.05));color:var(--ax-violet);display:flex;align-items:center;justify-content:center;font-size:.95rem}
    .ax-feat__item h3{margin:0 0 .2rem;font-size:.95rem;color:var(--ax-ink);font-weight:700}
    .ax-feat__item p{margin:0;font-size:.85rem;color:var(--ax-body);line-height:1.6}
    .ax-feat__media{border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(15,23,42,.2);border:1px solid rgba(15,23,42,.08)}
    .ax-feat__media img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
    .ax-sec--dark{background:var(--ax-ink);color:#fff;position:relative;overflow:hidden}
    .ax-sec--dark::before{content:"";position:absolute;top:-100px;left:20%;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.12),transparent 70%);pointer-events:none}
    .ax-sec--dark>.wrap{position:relative;z-index:1}
    .ax-center{text-align:center;max-width:720px;margin:0 auto 3rem}
    .ax-label{display:inline-block;font-family:'Fraunces',Georgia,serif;font-style:italic;color:var(--ax-violet);font-size:1.05rem;font-weight:500;margin-bottom:12px}
    .ax-label--indigo{color:var(--ax-indigo)}
    .ax-h2{font-family:'Fraunces',Georgia,serif;font-size:clamp(1.7rem,3.2vw,2.4rem);font-weight:500;color:var(--ax-ink);line-height:1.15;letter-spacing:-.01em;margin:0 0 1rem}
    .ax-h2--light{color:#fff}
    .ax-lead{color:var(--ax-body);font-size:1rem;line-height:1.75;margin:0 auto;max-width:640px}
    .ax-lead--wide{max-width:720px}
    .ax-lead--dark{color:rgba(255,255,255,.55);margin-bottom:2rem}
    .ax-split{display:grid;grid-template-columns:1fr 1.35fr;gap:3rem;align-items:start;margin-bottom:2.75rem}
    .ax-split__head .ax-h2{margin-bottom:0}
    .ax-split__body p{color:var(--ax-body);font-size:1rem;line-height:1.8;margin:0 0 1.1rem}
    .ax-split__body p:last-child{margin-bottom:0}
    .ax-callout{background:linear-gradient(135deg,rgba(124,58,237,.07),rgba(124,58,237,.02));border-left:3px solid var(--ax-violet);border-radius:0 14px 14px 0;padding:1.25rem 1.5rem}
    .ax-callout p{color:var(--ax-ink);font-weight:500;margin:0}
    .ax-drivers{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;justify-content:flex-start;gap:.75rem}
    .ax-drivers li{display:inline-flex;align-items:center;gap:.55rem;background:var(--ax-soft);border:1px solid rgba(15,23,42,.06);border-radius:50px;padding:.55rem 1.1rem;font-size:.85rem;font-weight:600;color:var(--ax-ink)}
    .ax-drivers li i{color:var(--ax-violet);font-size:.7rem}
    .ax-grid{display:grid;gap:1.25rem}
    .ax-grid--2{grid-template-columns:repeat(2,1fr)}
    .ax-grid--3{grid-template-columns:repeat(3,1fr)}
    .ax-grid--4{grid-template-columns:repeat(4,1fr)}
    .ax-grid--narrow{max-width:820px;margin:0 auto}
    .ax-card{background:#fff;border:1px solid rgba(15,23,42,.06);border-radius:14px;padding:1.75rem;text-align:left}
    .ax-sec:not(.ax-sec--soft) .ax-card{background:var(--ax-soft);border-color:rgba(15,23,42,.04)}
    .ax-card--tall{padding:2rem}
    .ax-card--center{display:flex;flex-direction:column;justify-content:center}
    .ax-card--media{padding:0;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:transform .3s ease,box-shadow .3s ease}
    .ax-card--media:hover{transform:translateY(-6px);box-shadow:0 22px 48px rgba(15,23,42,.18)}
    .ax-card__media{position:relative;height:200px;overflow:hidden;flex:0 0 auto}
    .ax-card__media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s ease}
    .ax-card--media:hover .ax-card__media img{transform:scale(1.05)}
    .ax-card__media-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(15,23,42,.88) 0%,rgba(15,23,42,.25) 55%,rgba(15,23,42,.05) 100%)}
    .ax-card__media-title{position:absolute;left:1.5rem;right:1.5rem;bottom:1.1rem;z-index:1;margin:0;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.2rem;color:#fff;letter-spacing:-.01em}
    .ax-list--media{padding:1.5rem 1.75rem .75rem;gap:.7rem;flex:1}
    .ax-card__more{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:auto;padding:1rem 1.75rem 1.3rem;border-top:1px solid rgba(15,23,42,.07);font-size:.82rem;font-weight:700;color:var(--ax-violet)}
    .ax-card__more i{font-size:.7rem;transition:transform .3s ease}
    .ax-card--media:hover .ax-card__more i{transform:translateY(3px)}
    .ax-sec[id]{scroll-margin-top:96px}
    .ax-card__icon{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:.9rem;font-size:1rem}
    .ax-card__icon--violet{background:linear-gradient(135deg,rgba(124,58,237,.12),rgba(124,58,237,.04));color:var(--ax-violet)}
    .ax-card__icon--indigo{background:linear-gradient(135deg,rgba(79,70,229,.12),rgba(79,70,229,.04));color:var(--ax-indigo)}
    .ax-card__icon--blue{background:linear-gradient(135deg,rgba(37,99,235,.12),rgba(37,99,235,.04));color:var(--ax-blue)}
    .ax-card__icon--gold{background:linear-gradient(135deg,rgba(217,164,65,.14),rgba(217,164,65,.05));color:var(--ax-gold)}
    .ax-card__title{font-weight:700;color:var(--ax-ink);font-size:.98rem;margin:0 0 .5rem;line-height:1.35}
    .ax-card__body{font-size:.85rem;color:var(--ax-body);margin:0;line-height:1.65}
    .ax-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.55rem}
    .ax-list li{display:flex;align-items:center;gap:.6rem;font-size:.88rem;color:var(--ax-ink);font-weight:500}
    .ax-list li i{flex:0 0 18px;width:18px;height:18px;border-radius:50%;background:rgba(124,58,237,.1);color:var(--ax-violet);font-size:.58rem;display:inline-flex;align-items:center;justify-content:center}
    .ax-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:.75rem}
    .ax-chip{display:inline-flex;align-items:center;gap:.5rem;border-radius:50px;padding:.6rem 1.3rem;font-weight:700;font-size:.85rem;color:#fff}
    .ax-chip i{font-size:.8rem}
    .ax-chip--violet{background:linear-gradient(135deg,var(--ax-violet),var(--ax-violet-2))}
    .ax-chip--indigo{background:linear-gradient(135deg,var(--ax-indigo),#818CF8)}
    .ax-chip--blue{background:linear-gradient(135deg,var(--ax-blue),#60A5FA)}
    .ax-note{text-align:center;max-width:720px;margin:2.5rem auto 0;color:var(--ax-body);font-size:.9rem;line-height:1.7;font-style:italic}
    .ax-pricing-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.1rem;margin:1.6rem auto 0;max-width:1000px}
    .ax-pricing-card{background:#fff;border:1px solid rgba(15,23,42,.06);border-radius:15px;padding:1.4rem 1.3rem;box-shadow:0 6px 16px rgba(15,23,42,.05);display:flex;flex-direction:column;min-height:100%}
    .ax-pricing-card--featured{border:1px solid rgba(124,58,237,.3);background:linear-gradient(180deg,#fff 0%,#f7f3ff 100%);transform:translateY(-6px)}
    .ax-pricing-card__header{margin-bottom:.85rem}
    .ax-pricing-card__tag{display:inline-flex;padding:.32rem .65rem;border-radius:999px;background:rgba(124,58,237,.08);color:var(--ax-violet);font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
    .ax-pricing-card__header h3{font-family:'Fraunces',Georgia,serif;margin:.55rem 0 0;font-size:1.5rem;line-height:1.1;color:var(--ax-ink)}
    .ax-pricing-card__header h3 span{font-family:'Inter',sans-serif;font-size:.8rem;color:var(--ax-body);font-weight:600}
    .ax-pricing-card__price-text{font-size:1.2rem!important}
    .ax-pricing-card__desc{margin:.4rem 0 0;font-size:.78rem;color:var(--ax-body);line-height:1.5}
    .ax-pricing-card__list{list-style:none;padding:0;margin:.9rem 0 1.1rem;display:flex;flex-direction:column;gap:.5rem;color:var(--ax-body);font-size:.83rem}
    .ax-pricing-card__list li{display:flex;align-items:flex-start;gap:.55rem}
    .ax-pricing-card__list li::before{content:"\f00c";font-family:"Font Awesome 6 Free";font-weight:900;color:var(--ax-violet);font-size:.72rem;margin-top:.25rem}
    .ax-pricing-card__cta{margin-top:auto;justify-content:center;padding:.6rem 1.2rem;font-size:.8rem}
    .ax-plan-note{max-width:720px;margin:2.5rem auto 0;padding:2rem;border-radius:18px;background:#fff;border:1px solid rgba(15,23,42,.06);box-shadow:0 18px 30px rgba(15,23,42,.04);text-align:center}
    .ax-plan-note h3{font-family:'Fraunces',Georgia,serif;margin:0 0 .6rem;font-size:1.35rem;color:var(--ax-ink)}
    .ax-plan-note p{margin:0;color:var(--ax-body);font-size:.92rem;line-height:1.7}
    .ax-plan-note__link{display:inline-flex;align-items:center;gap:.5rem;margin-top:1.1rem;font-weight:700;font-size:.88rem;color:var(--ax-violet);text-decoration:none}
    .ax-plan-note__link:hover{text-decoration:underline}
    .ax-plan-note__link i{font-size:.75rem}
    .ax-figure{max-width:1000px;margin:0 auto}
    .ax-figure img{width:100%;display:block}
    .ax-sec--case{background:linear-gradient(180deg,#fff 0%,var(--ax-soft) 100%)}
    .ax-case{display:grid;grid-template-columns:1fr 1.4fr;gap:3rem;align-items:center;max-width:980px}
    .ax-case__quote i{color:var(--ax-violet);font-size:1.6rem;margin-bottom:1rem;display:block;opacity:.7}
    .ax-case__quote p{font-family:'Fraunces',Georgia,serif;font-size:clamp(1.4rem,2.6vw,1.9rem);font-weight:600;color:var(--ax-ink);line-height:1.25;margin:0}
    .ax-case__body p{color:var(--ax-body);font-size:.95rem;line-height:1.75;margin:0 0 1.25rem}
    .ax-case__body blockquote{margin:0 0 .5rem;padding:0 0 0 1.25rem;border-left:3px solid rgba(124,58,237,.35);color:var(--ax-ink);font-size:.92rem;line-height:1.7;font-style:italic}
    .ax-case__cite{font-weight:700;color:var(--ax-ink);font-size:.82rem;margin:0 0 1.5rem}
    @media(max-width:991px){
        .ax-split{grid-template-columns:1fr;gap:1.5rem}
        .ax-feat{grid-template-columns:1fr;gap:2.5rem}
        .ax-feat__media{order:-1}
        .ax-grid--4{grid-template-columns:1fr 1fr}
        .ax-grid--3{grid-template-columns:1fr 1fr}
        .ax-pricing-grid{grid-template-columns:1fr}
        .ax-case{grid-template-columns:1fr;gap:2rem}
    }
    @media(max-width:767px){
        .ax-grid--2,.ax-grid--3{grid-template-columns:1fr}
        .ax-hero{background-size:cover;background-position:center}
        .ax-hero__shade{background:linear-gradient(180deg,rgba(0,3,8,.88),rgba(0,3,8,.78))}
        .ax-hero__inner{margin:0 auto}
    }
    @media(max-width:575px){
        .ax-grid--4{grid-template-columns:1fr}
        .ax-hero{padding:5.5rem 0 4rem}
        .ax-hero__actions .ax-btn{width:100%;justify-content:center}
    }
    @media(prefers-reduced-motion:reduce){
        .ax-btn:hover{transform:none}
    }
</style>
