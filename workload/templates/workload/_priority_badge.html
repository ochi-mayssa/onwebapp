<span class="wl-badge" style="background:
    {% if priority == 'CRITICAL' %}#fef2f2;color:#dc2626{% elif priority == 'HIGH' %}#fffbeb;color:#d97706{% elif priority == 'MEDIUM' %}#ecfdf9;color:#0f9d90{% else %}#f1f5f9;color:#64748b{% endif %};">
